[package]
name = "orpheus"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Server reimplementation for Overwatch 1.74"

[lib]
path = "rust/src/lib.rs"

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.3"
hmac = "0.12"
prost = "0.14"
prost-reflect = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
